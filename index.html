<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / installability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eab308" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ADMA Digital" />
    <link rel="apple-touch-icon" href="/adma-favicon-192.png" />
    <!-- iOS ignores manifest.json's background_color entirely for its own native
         launch screen (a long-standing Safari limitation) — without this, it falls
         back to a plain white background with the icon + apple-mobile-web-app-title
         text centered on it, which is what was actually being reported as "a page
         with the logo with a white background and the text ADMA Digital" (2026-09-01).
         No per-device media query — this is a single universal fallback image
         (1284x2778), scaled/cropped by Safari to fit whichever device it's on. -->
    <link rel="apple-touch-startup-image" href="/apple-touch-startup-image.png" />

    <!-- SEO / share -->
    <meta name="description" content="The digital platform for Zimbabwe's largest agricultural exhibition — ART Farm, Pomona, Harare." />
    <meta name="application-name" content="ADMA Digital" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://admadigital.co.zw" />
    <meta property="og:site_name"   content="ADMA Digital" />
    <meta property="og:title"       content="ADMA Digital — The Digital Platform for the ADMA Agri Show" />
    <meta property="og:description" content="Connecting machinery dealers, input suppliers, and service providers with farmers and buyers across Zimbabwe's agricultural value chain. Register, explore exhibitors, and book meetings for the ADMA Agri Show — 05-07 June 2026, ART Farm, Pomona, Harare." />
    <meta property="og:image"       content="https://adma-zw.s3.af-south-1.amazonaws.com/marketing-images/adma-logo-500x500.png" />
    <meta property="og:image:width"  content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt"   content="ADMA Digital Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="ADMA Digital — The Digital Platform for the ADMA Agri Show" />
    <meta name="twitter:description" content="Connecting machinery dealers, input suppliers, and service providers with farmers and buyers across Zimbabwe's agricultural value chain." />
    <meta name="twitter:image"       content="https://adma-zw.s3.af-south-1.amazonaws.com/marketing-images/adma-logo-500x500.png" />

    <!-- Structured data (Google Event rich results). Static and server-rendered
         deliberately — these are fixed event facts (not per-user/per-route), so this is
         the single most reliable way to guarantee Google's very first fetch of the page
         sees them, no JS execution required. Per-page structured data (e.g. exhibitor
         Organization schema) is added separately, either client-side via useSEO.js or
         server-side in server/routes/og.js for the exhibitor-detail case specifically. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "ADMA Agri Show 2026",
      "description": "Zimbabwe's largest agricultural exhibition, connecting machinery dealers, input suppliers, and service providers with farmers and buyers across the agricultural value chain.",
      "startDate": "2026-06-05",
      "endDate": "2026-06-07",
      "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
      "eventStatus": "https://schema.org/EventScheduled",
      "location": {
        "@type": "Place",
        "name": "ART Farm, Pomona",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Harare",
          "addressCountry": "ZW"
        }
      },
      "image": ["https://adma-zw.s3.af-south-1.amazonaws.com/marketing-images/adma-logo-500x500.png"],
      "organizer": {
        "@type": "Organization",
        "name": "ADMA Digital",
        "url": "https://admadigital.co.zw"
      },
      "url": "https://admadigital.co.zw"
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/adma-favicon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <title>ADMA Digital</title>

    <!-- Startup-screen fix (2026-09-01): sets the page background to the same dark
         steel the home page hero and App.jsx's loading screen use, inline and before
         any stylesheet loads — so there's no white flash between the native OS splash
         (manifest background_color, a solid color only — the platform doesn't support
         a gradient there) and the app's own loading screen painting in. #1b3729 is
         --adma-steel (src/index.css) converted to hex, since this has to be a literal
         value here, not a CSS variable that isn't defined yet at this point. -->
    <style>html, body { background: #1b3729; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
