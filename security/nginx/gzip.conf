# Reference copy — deploy.yml does not manage nginx config, only app code, so this
# is not automatically applied anywhere. It's the exact file placed at
# /etc/nginx/conf.d/gzip.conf on both EC2 instances (primary + backup) on
# 2026-08-28, after discovering gzip had never actually been enabled (only
# present, commented out, in the unused nginx.conf.default template) — the main
# JS bundle was taking 70+ seconds to load as a result. See RISK_REGISTER.md #3
# and #13, and INCIDENT_RESPONSE_PLAN.md's incident log for the fuller story.
#
# To restore on a fresh/replacement instance:
#   sudo cp security/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Standard text-asset gzip; already-compressed formats (images, video, fonts as
# woff2) are deliberately left out since re-compressing them wastes CPU for no
# size benefit.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
