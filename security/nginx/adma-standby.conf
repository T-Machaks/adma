# Repo backup of the STANDBY instance's nginx config (i-0b3233db9d8a576e6). Discovered
# 2026-08-31 during the CSP-broadening deploy that this file had never been captured in
# the repo before — only the primary's config (adma.conf) was kept in sync. This is a
# real gap the repo previously had: the standby's config had silently drifted structurally
# from the primary's (HTTP-only, single server block, no Certbot SSL block — see the
# preamble comment inside the config itself) and nobody would have known without SSH'ing
# in. Captured here going forward so future changes (like this CSP broadening) can be
# reviewed and diffed the same way as the primary's.
#
# 2026-08-31 CSP broadening — see adma.conf's preamble for the full rationale (14-day
# CloudWatch Report-Only violation history: pasted external image URLs, a service worker
# CSP-inheritance quirk, missing S3 frame-src). Same header change applied here.
#
# Lines below are the real, deployable nginx config content (verbatim from the instance).

# Standby nginx config — HTTP only until promotion. Mirrors the primary's location
# blocks (API proxy, static assets, CSP headers) but does NOT try to serve TLS yet,
# since no cert exists here until Certbot runs at promotion time (needs DNS pointing
# here first to complete the HTTP-01 challenge). See security/PROMOTION_RUNBOOK.md.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name adma.tyflex.co.zw admadigital.co.zw www.admadigital.co.zw _;

    root /home/ec2-user/adma/dist;
    index index.html;
    location ~ ^/exhibitors/[^/]+$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Only the QR-scanner feature (src/components/QRScanner.jsx) uses a browser API here —
        # getUserMedia({video: ...}) for same-origin camera access. Everything else is denied.
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https: https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m;

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https: https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }
}
