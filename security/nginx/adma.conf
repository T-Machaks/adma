# Reference copy of /etc/nginx/conf.d/adma.conf, captured 2026-08-28 — see
# RISK_REGISTER.md #3 ("nginx config exists only on the EC2 instance, no
# off-instance backup"). deploy.yml does not manage this file; it's applied by
# hand (via Certbot for the TLS blocks, manually for everything else) and was
# never backed up outside the two instances until now. This is a point-in-time
# snapshot, not something kept automatically in sync — re-capture it after any
# manual nginx config change on the instances.
#
# To restore on a fresh/replacement instance (after Certbot has issued its own
# certificate — the ssl_certificate paths here are instance-specific):
#   sudo cp security/nginx/adma.conf /etc/nginx/conf.d/adma.conf
#   sudo cp security/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx

# CAIQ Phase 2 item 12 — interim WAF-style protection at the nginx layer, in front of the
# app's own express-rate-limit (20 req/15min on /api/auth/, 600 req/15min elsewhere).
# This zone is deliberately generous (20 req/s per IP, burst 50) — it exists to reject
# genuinely abusive scripted floods before they cost a Node process cycle, not to duplicate
# the app's own finer-grained limits. 10m zone size holds ~160k tracked IPs.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    server_name adma.tyflex.co.zw admadigital.co.zw www.admadigital.co.zw;

    root /home/ec2-user/adma/dist;
    index index.html;
    location ~ ^/exhibitors/[^/]+$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    client_max_body_size 10m;

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/adma.tyflex.co.zw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adma.tyflex.co.zw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = adma.tyflex.co.zw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name adma.tyflex.co.zw;
    return 404; # managed by Certbot
}
server {
    if ($host = www.admadigital.co.zw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = admadigital.co.zw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admadigital.co.zw www.admadigital.co.zw;
    return 404; # managed by Certbot
}
