# Reference copy of /etc/nginx/conf.d/adma.conf on the PRIMARY instance, re-captured
# 2026-08-31 — supersedes the 2026-08-28 snapshot, which was stale as soon as the
# redirect-loop fix below landed. deploy.yml does not manage this file; it's applied
# by hand (via Certbot for the TLS blocks, manually for everything else). Point-in-time
# only — re-capture again after any further hand edit.
#
# Changed since the 2026-08-28 capture: the third server block (admadigital.co.zw /
# www, port 80) now serves the app directly instead of unconditionally redirecting to
# https, with a conditional redirect based on X-Forwarded-Proto — see the inline
# comment on that block for why. This was required before the ALB could safely forward
# decrypted traffic here (an unconditional redirect would otherwise loop forever:
# ALB→nginx→301 https→ALB→nginx→301 https→...). Paired with tightening
# sg-0399ccd0797f2d0bd (both EC2 instances) to only accept 80/443 from the ALB's own
# security group (sg-09d2b7744e18e0aa3) instead of 0.0.0.0/0 — without that, the
# X-Forwarded-Proto trust this fix relies on could be spoofed by anyone hitting the
# instance directly. adma.tyflex.co.zw direct access is retired as a result (confirmed
# acceptable — legacy/unused).
#
# The backup/standby instance's config is intentionally simpler (HTTP-only, no TLS,
# no redirect logic at all — see PROMOTION_RUNBOOK.md) and untouched by this fix, since
# it never had the redirect-loop risk to begin with.

# CAIQ Phase 2 item 12 — interim WAF-style protection at the nginx layer, in front of the
# app's own express-rate-limit (20 req/15min on /api/auth/, 600 req/15min elsewhere).
# This zone is deliberately generous (20 req/s per IP, burst 50) — it exists to reject
# genuinely abusive scripted floods before they cost a Node process cycle, not to duplicate
# the app's own finer-grained limits. 10m zone size holds ~160k tracked IPs.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    server_name adma.tyflex.co.zw admadigital.co.zw www.admadigital.co.zw;

    root /home/ec2-user/adma/dist;
    index index.html;
    location ~ ^/exhibitors/[^/]+$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Only the QR-scanner feature (src/components/QRScanner.jsx) uses a browser API here —
        # getUserMedia({video: ...}) for same-origin camera access. Everything else is denied.
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    client_max_body_size 10m;

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/adma.tyflex.co.zw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adma.tyflex.co.zw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # OCSP stapling (2026-08-29) — lets the server fetch and cache the certificate's revocation
    # status from Let's Encrypt itself and hand it to clients during the TLS handshake, instead
    # of every client having to query the CA's OCSP responder separately. Uses the VPC's own
    # resolver (169.254.169.253) to look up the OCSP responder's hostname. NOTE: verified a no-op
    # in practice — this cert's issuer (Let's Encrypt's "YE1" intermediate) carries no OCSP
    # responder URL, only CRL. Left in for forward-compatibility; harmless (nginx just warns).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/adma.tyflex.co.zw/chain.pem;
    resolver 169.254.169.253 valid=300s;
    resolver_timeout 5s;
}
server {
    # ALB health check exemption (2026-08-28) — the ALB's health-check request has
    # no Host header matching any server_name below, so it lands here (default_server).
    # The bare `return 404` Certbot originally put directly in this server block (not
    # inside a location) fires unconditionally during nginx's rewrite phase, before
    # location matching even happens — so it had to move inside its own `location /`
    # for a more specific location (this one) to ever get a chance to match first.
    location /api/health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    if ($host = adma.tyflex.co.zw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name adma.tyflex.co.zw;

    location / {
        return 404; # managed by Certbot
    }
}
server {
    # ALB health check exemption — same reasoning as the block above.
    location /api/health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Redirect-loop fix (2026-08-31, CAIQ Phase B / ALB cutover) — once the ALB
    # terminates TLS and forwards the *decrypted* request here as plain HTTP, the old
    # unconditional `if ($host = ...) return 301 https://...` fired every single time,
    # sending the client straight back through the ALB into the same redirect forever.
    # The ALB sets X-Forwarded-Proto to whatever the client actually used, so only
    # redirect when that's missing or not https — i.e. a genuine direct plain-HTTP hit
    # (which, now that the security group only accepts 80/443 from the ALB's own SG,
    # can only mean something inside the VPC — the ALB itself never sends plain http
    # this way for an originally-https request). nginx's `if` can't combine conditions
    # natively, hence the two-step set/if.
    set $needs_https_redirect 0;
    if ($http_x_forwarded_proto != https) {
        set $needs_https_redirect 1;
    }
    if ($needs_https_redirect = 1) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name admadigital.co.zw www.admadigital.co.zw;

    root /home/ec2-user/adma/dist;
    index index.html;
    client_max_body_size 10m;

    location ~ ^/exhibitors/[^/]+$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme — nginx itself is listening in plain HTTP here, but the
        # ALB already terminated a genuinely-HTTPS client connection to get here (the
        # redirect above guarantees that). The app (trust proxy 1, cookie/CORS logic)
        # needs to see the client's real scheme, not nginx's own local listener.
        proxy_set_header X-Forwarded-Proto https;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://i.ytimg.com; media-src 'self' https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://accounts.google.com https://www.google.com https://us05web.zoom.us https://app.zoom.us; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://connect.facebook.net https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://login.microsoftonline.com https://graph.microsoft.com https://graph.facebook.com https://connect.facebook.net https://adma-zw.s3.af-south-1.amazonaws.com https://adma.s3.af-south-1.amazonaws.com https://fonts.googleapis.com https://fonts.gstatic.com https://i.ytimg.com; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://admadigital.co.zw/api/csp-report"}]}' always;
    }
}
